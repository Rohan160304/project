services:
  # ─── Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: jinanam-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_BASE_PATH
        value: /api/v1
      - key: APP_NAME
        value: JiNANAM

      # Database — linked to the postgres instance below
      - key: DATABASE_URL
        fromDatabase:
          name: jinanam-db
          property: connectionString

      # Redis — linked to the redis instance below
      - key: REDIS_URL
        fromService:
          name: jinanam-redis
          type: redis
          property: connectionString

      # JWT Secrets — set manually in Render dashboard (do NOT commit real values)
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d

      # OTP config
      - key: OTP_LENGTH
        value: 6
      - key: OTP_TTL_SECONDS
        value: 300
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 30

      # QR / HMAC
      - key: QR_SIGNING_SECRET
        sync: false

      # Field Encryption (AES-256-GCM) — must be 32 bytes, base64 encoded
      - key: FIELD_ENCRYPTION_KEY
        sync: false

      # Storage — local filesystem on Render (ephemeral, good for testing)
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: ./storage/uploads
      - key: STORAGE_PUBLIC_BASE_URL
        value: https://jinanam-backend.onrender.com/static

      # CORS — allow all for testing
      - key: CORS_ORIGIN
        value: "*"

      # Rate limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 120
      - key: OTP_RATE_LIMIT_MAX
        value: 5

  # ─── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: jinanam-redis
    region: singapore
    plan: free
    ipAllowList: []


# ─── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: jinanam-db
    databaseName: jinanam
    user: jinanam
    region: singapore
    plan: free

